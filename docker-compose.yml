services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deska
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deska123}
      POSTGRES_DB: deska_erp
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deska -d deska_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${IMAGE_PREFIX:-deskaerp}/api:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://deska:${POSTGRES_PASSWORD:-deska123}@postgres:5432/deska_erp
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      APP_VERSION: ${APP_VERSION:-1.0.0}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PORT: 3001
      TENANT_MODE: multi
      STORAGE_TYPE: local
      STORAGE_PATH: /app/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@deska.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@1234}
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${IMAGE_PREFIX:-deskaerp}/web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.0.0}
        NEXT_PUBLIC_BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_URL: http://api:3001
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.0.0}
      NEXT_PUBLIC_BASE_PATH: ${BASE_PATH:-}
    depends_on:
      - api

volumes:
  postgres_data:
  api_uploads:
