name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://deska:ci-only-password@localhost:5432/deska_erp_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deska
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: deska_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @deska/shared build

      - name: Generate Prisma client
        run: pnpm --filter @deska/api db:generate

      - name: Verify clean migration chain
        run: |
          pnpm --filter @deska/api exec prisma migrate deploy
          pnpm --filter @deska/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Audit tenant data integrity
        run: pnpm db:audit

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @deska/api build
      - run: pnpm --filter @deska/web build
