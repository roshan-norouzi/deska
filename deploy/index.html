<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استقرار DESKA</title>
  <style>
    :root{font-family:Tahoma,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(720px,100%);background:#fff;border:1px solid #e3e9f2;border-radius:22px;box-shadow:0 18px 55px #1f4b7d18;padding:32px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#2165ec,#4939d8);color:#fff;display:grid;place-items:center;font-size:24px}.muted{color:#71809a;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}label{font-size:13px;color:#53627a}input{width:100%;border:1px solid #d7dfeb;border-radius:11px;padding:12px 13px;font:inherit;direction:ltr;text-align:left;outline:none}input:focus{border-color:#3974ed;box-shadow:0 0 0 3px #3974ed18}.section{font-size:14px;font-weight:700;margin:24px 0 12px;border-bottom:1px solid #edf1f6;padding-bottom:10px}.actions{display:flex;align-items:center;gap:12px;margin-top:25px}button{border:0;border-radius:11px;padding:12px 20px;background:#2165ec;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{font-size:13px}.ok{color:#16834b}.err{color:#c73737}.note{margin-top:20px;padding:12px 14px;border-radius:12px;background:#fff8e6;color:#785b11;font-size:12px;line-height:1.8}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="logo">↻</div><div><h1>استقرار DESKA</h1><div class="muted">اجرای امن انتشار و به‌روزرسانی روی سرور</div></div></div>
    <div class="section">اطلاعات GitHub</div>
    <div class="grid">
      <div class="field"><label for="owner">نام کاربری</label><input id="owner" value="roshan-norouzi" autocomplete="off"></div>
      <div class="field"><label for="repo">نام Repository</label><input id="repo" value="deska" autocomplete="off"></div>
      <div class="field full"><label for="token">GitHub Token (در صفحه ذخیره نمی‌شود)</label><input id="token" type="password" placeholder="Token را فقط هنگام اجرا وارد کنید" autocomplete="off"></div>
    </div>
    <div class="section">اطلاعات سرور</div>
    <div class="grid">
      <div class="field"><label for="host">دامنه</label><input id="host" value="pixad.ir" autocomplete="off"></div>
      <div class="field"><label for="sshUser">کاربر SSH</label><input id="sshUser" value="root" autocomplete="off"></div>
      <div class="field full"><label for="path">مسیر نصب</label><input id="path" value="/www/wwwroot/pixad.ir/deska" autocomplete="off"></div>
    </div>
    <div class="actions"><button id="deploy">اجرای به‌روزرسانی</button><span id="status" class="status"></span></div>
    <div class="note">رمز سرور، کلید SSH و تنظیمات اتصال باید در GitHub Secrets ثبت شده باشند. این صفحه فقط Workflow را اجرا می‌کند و اطلاعات محرمانهٔ سرور را ارسال نمی‌کند.</div>
  </main>
  <script>
    const $=id=>document.getElementById(id); const btn=$('deploy'), status=$('status');
    btn.onclick=async()=>{const owner=$('owner').value.trim(),repo=$('repo').value.trim(),token=$('token').value.trim(); if(!owner||!repo||!token){status.textContent='نام کاربری، Repository و Token را کامل کنید.';status.className='status err';return} btn.disabled=true;status.textContent='در حال اجرای Workflow...';status.className='status'; try{const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/actions/workflows/deploy.yml/dispatches`,{method:'POST',headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({ref:'main'})}); if(!r.ok) throw new Error(`GitHub خطای ${r.status} برگرداند`); status.textContent='Workflow با موفقیت اجرا شد؛ وضعیت را در تب Actions ببینید.';status.className='status ok';$('token').value='';}catch(e){status.textContent=e.message;status.className='status err'}finally{btn.disabled=false}};
  </script>
</body>
</html>
